{% extends 'portfolio/layout.html' %}

{% block content %}
    <h3>Edit TFC</h3>
    
    <form action="{% url 'portfolio:edit_tfc' tfc.id %}" method="post" enctype='multipart/form-data'>
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit" value="Save">
    </form>  
    
    <a href="{% url 'portfolio:tfc' tfc.id %}">
      <button>Cancel</button>
    </a>

    <a href="{% url 'portfolio:delete_tfc' tfc.id %}">
      <button>Delete TFC</button>
    </a>

{% endblock %}
