<html>
    <head>
        <title>Portfolio</title>
        <style>
            body {
                background: rgb(17, 2, 26);
                color: white;
                margin: 0px;
            }
            .errorlist {
                display:none;
            }
            header {
                border-bottom: 1px solid white;
                background: rgb(31, 5, 47);

                top: 0;
                left: 0;

                width: 100%;

                padding: 5px;
            }
            header nav{
                display:flex;
                flex-direction:row;
                justify-content: flex-start;
                gap:15px;
            }
            main {
                margin: 10px 10px 100px 10px;
            }
            main li {
                list-style: none;
                padding: 10px;
                width: 500px;
                margin-bottom: 10px;
            }
            footer {
                position: fixed;
                
                border-top: 1px solid white;
                background: rgb(31, 5, 47);

                bottom: 0;
                left: 0;

                width: 100%;
                height: 50px;

                padding: 5px;
            }
            table th {text-align:right;}
            helptext {
                font-size: 0.7em;
                color: gray;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Portfolio</h1>
            <nav>
                <a href="{% url 'portfolio:index' %}">Home</a>
                <a href="{% url 'portfolio:educations' %}">Education</a>
                <a href="{% url 'portfolio:projects' %}">Projects</a>
                <a href="{% url 'portfolio:skills' %}">Skills</a>
                <a href="{% url 'portfolio:makingof' %}">Making Of</a>
                {% if request.user.is_authenticated %}
                    <a href="{% url 'accounts:user' %}">{{ request.user.username }} ({{ request.user.first_name}} {{ request.user.last_name}})</a>
                {% else %}
                    <a href="{% url 'accounts:register' %}">Register/Login</a>
                {% endif %}
            </nav>
        </header>

        <main>

            {% block content %}
            {% endblock %}

        </main>

        <footer>
            <p>Julia Costa ©2026</p>
        </footer>
    </body>
</html>
