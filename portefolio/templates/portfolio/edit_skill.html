{% extends 'portfolio/layout.html' %}

{% block content %}
    <h3>Edit Skill</h3>
    
    <form action="{% url 'portfolio:edit_skill' skill.id %}" method="post" enctype='multipart/form-data'>
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit" value="Save">
    </form>  
    
    <a href="{% url 'portfolio:skill' skill.id %}">
      <button>Cancel</button>
    </a>

    <a href="{% url 'portfolio:delete_skill' skill.id %}">
      <button>Delete Skill</button>
    </a>

{% endblock %}
