{% extends 'portfolio/layout.html' %}

{% block content %}
    <h3>Edita Autor</h3>
    
    <form action="{% url 'portfolio:edit_course' course.id %}" method="post" enctype='multipart/form-data'>
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit" value="Save">
    </form>  
    
    <a href="{% url 'portfolio:course' course.id %}">
      <button>Cancelar</button>
    </a>

    <a href="{% url 'portfolio:delete_course' course.id %}">
      <button>Delete Course</button>
    </a>

{% endblock %}
