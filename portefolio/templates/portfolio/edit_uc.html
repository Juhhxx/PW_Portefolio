{% extends 'portfolio/layout.html' %}

{% block content %}
    <h3>Edit UC</h3>
    
    <form action="{% url 'portfolio:edit_uc' uc.id %}" method="post" enctype='multipart/form-data'>
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit" value="Save">
    </form>  
    
    <a href="{% url 'portfolio:uc' uc.id %}">
      <button>Cancel</button>
    </a>

    <a href="{% url 'portfolio:delete_uc' uc.id %}">
      <button>Delete UC</button>
    </a>

{% endblock %}
