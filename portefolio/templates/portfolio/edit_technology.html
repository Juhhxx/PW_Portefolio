{% extends 'portfolio/layout.html' %}

{% block content %}
    <h3>Edit Technology</h3>
    
    <form action="{% url 'portfolio:edit_technology' technology.id %}" method="post" enctype='multipart/form-data'>
      {% csrf_token %}
      {{ form.as_p }}
      <input type="submit" value="Save">
    </form>  
    
    <a href="{% url 'portfolio:technology' technology.id %}">
      <button>Cancel</button>
    </a>

    <a href="{% url 'portfolio:delete_technology' technology.id %}">
      <button>Delete Technology</button>
    </a>

{% endblock %}
